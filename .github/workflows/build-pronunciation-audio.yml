name: Build pronunciation audio

on:
  push:
    branches: [main]
    paths:
      - "data/catalog.json"
      - "data/decks/**"
      - "tools/generate_audio.py"
      - ".github/workflows/build-pronunciation-audio.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Generate same-origin pronunciation bundles
        run: python3 tools/generate_audio.py
      - name: Commit generated audio when changed
        run: |
          if git diff --quiet -- data/audio; then
            echo "Pronunciation audio is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio
          git commit -m "Generate pronunciation audio"
          git push
